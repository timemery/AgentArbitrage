[pytest]
# Keep `pytest` and `./run_tests.sh` in agreement about what the suite is.
#
# testpaths: the suite lives in tests/. Without this, a bare `pytest` walks the repo
#   root and collects the verify_*.py / trace_*.py helper scripts.
# norecursedirs: tests/Legacy holds abandoned modules that import scripts no longer in
#   the repo, so collecting them aborts the whole run with a collection error. The old
#   run_tests.sh skipped them with `find -maxdepth 1`; this is the same exclusion.
testpaths = tests
norecursedirs = Legacy Archive venv .git __pycache__ node_modules
